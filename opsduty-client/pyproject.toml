[tool.poetry]
name = "opsduty-client"
version = "0.1.0"
description = "A client library for accessing OpsDuty API"
authors = []
readme = "README.md"
packages = [
    { include = "opsduty_client" },
]
include = ["opsduty_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.1,<0.29.0"
attrs = ">=22.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

